name: Deploy LiveX website
# Always fetch the newest signed APKs from the latest LiveX release.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download private LiveX APKs
        env:
          LIVEX_READ_TOKEN: ${{ secrets.LIVEX_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LIVEX_READ_TOKEN:-}" ]; then
            echo "::error::Configure LIVEX_READ_TOKEN in LiveX-Web repository secrets."
            exit 1
          fi
          mkdir -p downloads
          release_json="$(curl -fsSL \
            -H "Authorization: Bearer $LIVEX_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lucasmoraesm6/LiveX/releases/latest)"
          asset_name="app-release.apk"
          asset_url="$(printf '%s' "$release_json" | jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .url' | head -n 1)"
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "::error::Release asset not found: $asset_name"
            exit 1
          fi
          curl -fL \
            -H "Authorization: Bearer $LIVEX_READ_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$asset_url" \
            -o "downloads/$asset_name"
          test -s "downloads/$asset_name"
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
